<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1E5C47">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Журнал">
<meta name="robots" content="noindex,nofollow">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head><body>
<title>Журнал преподавателя</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&family=Literata:ital,opsz,wght@0,7..72,500;0,7..72,600;1,7..72,500&display=swap">
<style>
/* Layout: app shell — sidebar + working area on desktop, top bar + bottom tabs on phone. Journal green on cool paper. */
:root{
  --bg:#F3F5F4; --surface:#FFFFFF; --surface-2:#EBEFED; --surface-3:#E1E7E4;
  --line:#D6DDDA; --line-2:#C3CDC9;
  --ink:#15201C; --ink-2:#46544F; --ink-3:#7A8782;
  --accent:#1E5C47; --accent-2:#2A7A5F; --accent-ink:#FFFFFF; --accent-soft:#DBEAE3;
  --gold:#C9971E; --gold-soft:#F6ECD2;
  --g5:#1B7F55; --g5s:#DDF1E6; --g4:#2864A3; --g4s:#DFEAF6; --g3:#A8740A; --g3s:#F7EBCF; --g2:#BE3B30; --g2s:#F8E0DD; --gn:#6E7B76; --gns:#E7EBE9;
  --shadow:0 1px 2px rgba(20,40,32,.06),0 6px 24px -10px rgba(20,40,32,.18);
  --f-display:"Literata",Georgia,"Times New Roman",serif;
  --f-body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  --r:10px; --r-sm:7px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0E1412; --surface:#151D1A; --surface-2:#1B2521; --surface-3:#22302B;
  --line:#26332E; --line-2:#33433D;
  --ink:#E4ECE8; --ink-2:#A7B5AF; --ink-3:#73817B;
  --accent:#5DC09A; --accent-2:#7FD3B2; --accent-ink:#06130E; --accent-soft:#1A3A2E;
  --gold:#E2B54A; --gold-soft:#3A3018;
  --g5:#5BCB93; --g5s:#173527; --g4:#74A9E6; --g4s:#182B40; --g3:#E3B04B; --g3s:#3A2E14; --g2:#F07D72; --g2s:#3D1E1B; --gn:#97A49F; --gns:#26302D;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 28px -12px rgba(0,0,0,.6);
  color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0E1412; --surface:#151D1A; --surface-2:#1B2521; --surface-3:#22302B;
  --line:#26332E; --line-2:#33433D;
  --ink:#E4ECE8; --ink-2:#A7B5AF; --ink-3:#73817B;
  --accent:#5DC09A; --accent-2:#7FD3B2; --accent-ink:#06130E; --accent-soft:#1A3A2E;
  --gold:#E2B54A; --gold-soft:#3A3018;
  --g5:#5BCB93; --g5s:#173527; --g4:#74A9E6; --g4s:#182B40; --g3:#E3B04B; --g3s:#3A2E14; --g2:#F07D72; --g2s:#3D1E1B; --gn:#97A49F; --gns:#26302D;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 28px -12px rgba(0,0,0,.6);
  color-scheme:dark }

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--f-body);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

/* ---------- shell ---------- */
.shell{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100%}
.side{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px;padding:22px 14px;border-right:1px solid var(--line);background:var(--surface)}
.brand{display:flex;flex-direction:column;padding:0 10px 18px}
.brand b{font:italic 500 26px/1 var(--f-display);letter-spacing:-.01em}
.brand span{font-size:12px;color:var(--ink-3);margin-top:6px}
.nav-i{display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:var(--r-sm);color:var(--ink-2);font-weight:500;text-align:left;width:100%}
.nav-i svg{width:19px;height:19px;flex:none}
.nav-i:hover{background:var(--surface-2);color:var(--ink)}
.nav-i[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
.nav-i.primary{margin:8px 0;background:var(--accent);color:var(--accent-ink)}
.nav-i.primary:hover{background:var(--accent-2)}
.side-foot{margin-top:auto;padding:12px 10px 0;border-top:1px solid var(--line);font-size:12px;color:var(--ink-3);display:flex;gap:8px;align-items:flex-start}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ink-3);flex:none;margin-top:5px}
.dot.ok{background:var(--g5)} .dot.warn{background:var(--gold)}

.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;display:flex;align-items:center;gap:12px;padding:12px 28px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top h1{font:600 20px/1.2 var(--f-display);margin:0;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.top .sp{flex:1}
.search{position:relative;width:min(300px,40vw)}
.search input{width:100%;padding:8px 12px 8px 34px;border:1px solid var(--line);border-radius:999px;background:var(--surface);outline:none}
.search input:focus{border-color:var(--accent)}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--ink-3)}
.sres{position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:6px;max-height:340px;overflow:auto;z-index:60}
.sres button{display:flex;justify-content:space-between;gap:10px;width:100%;padding:8px 10px;border-radius:6px;text-align:left}
.sres button:hover,.sres button.on{background:var(--surface-2)}
.sres small{color:var(--ink-3)}
.icon-btn{width:36px;height:36px;display:grid;place-items:center;border-radius:50%;color:var(--ink-2)}
.icon-btn:hover{background:var(--surface-2)}
.icon-btn svg{width:19px;height:19px}
.content{padding:24px 28px 60px;display:flex;flex-direction:column;gap:22px;min-width:0}
.tabbar{display:none}
.only-m{display:none}

/* ---------- common ---------- */
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chipbar{display:flex;flex-direction:column;gap:10px;min-width:0;max-width:100%}
.course-seg{flex-wrap:wrap;max-width:100%}
.course-seg button{max-width:min(340px,100%);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip{padding:6px 13px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:500;font-size:14px;color:var(--ink-2)}
.chip:hover{border-color:var(--line-2);color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.seg{display:inline-flex;background:var(--surface-2);border-radius:9px;padding:3px;gap:2px}
.seg button{padding:6px 12px;border-radius:7px;font-weight:500;font-size:14px;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:9px 16px;border-radius:var(--r-sm);font-weight:600;font-size:14px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.btn:hover{border-color:var(--line-2);background:var(--surface-2)}
.btn svg{width:17px;height:17px}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{background:var(--accent-2)}
.btn.danger{color:var(--g2);border-color:color-mix(in srgb,var(--g2) 40%,var(--line))}
.btn.danger:hover{background:var(--g2s)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--surface-2)}
.btn.sm{padding:6px 11px;font-size:13px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.h2{font:600 18px/1.25 var(--f-display);margin:0;letter-spacing:-.005em;text-wrap:balance}
.eyebrow{font-size:13px;font-weight:500;color:var(--ink-3)}
.muted{color:var(--ink-3)}
.small{font-size:13px}
.field{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--ink-2)}
.inp{padding:8px 10px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface);outline:none;min-width:0}
.inp:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
textarea.inp{resize:vertical;min-height:90px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.st-plan{color:var(--ink-3);background:var(--gns)}
.st-done{color:var(--g5);background:var(--g5s)}
.st-moved{color:var(--g3);background:var(--g3s)}
.st-cancel{color:var(--g2);background:var(--g2s)}
.empty{padding:36px 20px;text-align:center;color:var(--ink-3);display:flex;flex-direction:column;align-items:center;gap:12px}
.empty b{font:600 18px var(--f-display);color:var(--ink)}
.bar{height:6px;border-radius:99px;background:var(--surface-3);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:inherit}

/* ---------- today ---------- */
.hero{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.hero .date{font:500 34px/1.05 var(--f-display);letter-spacing:-.02em;margin:4px 0 0;text-wrap:balance}
.hero .date i{font-style:italic;color:var(--accent)}
.gcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
.gcard{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px;transition:border-color .15s,transform .15s}
.gcard:hover{border-color:var(--accent);transform:translateY(-1px)}
.gc-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.gc-name{font:600 19px var(--f-display)}
.gc-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:0}
.gc-stats dt{font-size:11px;color:var(--ink-3)}
.gc-stats dd{margin:0;font:600 17px var(--f-mono)}
.gc-next{font-size:13px;color:var(--ink-2);border-top:1px dashed var(--line);padding-top:9px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.two{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:18px;align-items:start}
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.li .grow{flex:1;min-width:0}
.li .t{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .s{font-size:12.5px;color:var(--ink-3)}
.gtag{font:600 12px var(--f-mono);padding:3px 8px;border-radius:6px;background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.daytag{font:600 12px var(--f-mono);min-width:44px;text-align:center;color:var(--ink-2)}
.risk-n{font:600 15px var(--f-mono);color:var(--g2);min-width:28px;text-align:right}
.li.click{cursor:pointer;border-radius:6px}
.li.click:hover{background:var(--surface-2)}

/* ---------- journal grid ---------- */
.jhead{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.grid-wrap{overflow:auto;max-height:calc(100dvh - 230px);border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overscroll-behavior:contain}
table.grid{border-collapse:separate;border-spacing:0;font-size:13.5px}
.grid th,.grid td{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:0;height:34px;background:var(--surface)}
.grid thead th{position:sticky;top:0;z-index:3;background:var(--surface-2);font-weight:500;vertical-align:bottom}
.grid tfoot td{position:sticky;bottom:0;z-index:2;background:var(--surface-2);font:500 11.5px var(--f-mono);color:var(--ink-3);text-align:center}
.grid .c-no{position:sticky;left:0;z-index:2;width:36px;min-width:36px;text-align:center;color:var(--ink-3);font:12px var(--f-mono)}
.grid .c-name{position:sticky;left:36px;z-index:2;min-width:230px;max-width:230px;text-align:left;padding:0 10px;border-right:2px solid var(--line-2)}
.grid thead .c-no,.grid thead .c-name,.grid tfoot .c-no,.grid tfoot .c-name{z-index:4;background:var(--surface-2)}
.c-name button{width:100%;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block;padding:7px 0}
.c-name button:hover{color:var(--accent);text-decoration:underline;text-underline-offset:3px}
.grid tbody tr:hover td{background:color-mix(in srgb,var(--accent-soft) 35%,var(--surface))}
.grid tbody tr.risk .c-name button{color:var(--g2)}
.lh{width:40px;min-width:40px;padding:6px 0 5px!important;text-align:center;cursor:pointer;border-top:3px solid transparent}
.lh:hover{background:var(--surface-3)!important}
.lh .n{display:block;font:600 12.5px var(--f-mono);color:var(--ink)}
.lh .d{display:block;font:10.5px var(--f-mono);color:var(--ink-3);margin-top:2px}
.lh .k{display:block;font-size:9.5px;font-weight:600;letter-spacing:.04em;color:var(--accent);height:12px}
.lh.s-done{border-top-color:var(--g5)} .lh.s-moved{border-top-color:var(--g3)} .lh.s-cancel{border-top-color:var(--g2);opacity:.6}
.lh.today{background:var(--gold-soft)!important}
td.today{box-shadow:inset 1px 0 0 var(--gold),inset -1px 0 0 var(--gold)}
.cell{width:100%;height:33px;display:grid;place-items:center;font:600 13.5px var(--f-mono);border-radius:0}
.cell:hover{background:var(--surface-3)}
.cell:focus-visible,.cell.sel{outline:2px solid var(--accent);outline-offset:-2px;background:var(--accent-soft)}
.cell.a-p::after{content:"";width:6px;height:6px;border-radius:50%;background:color-mix(in srgb,var(--g5) 60%,transparent)}
.cell.a-n{color:var(--g2);background:var(--g2s)}
.cell.a-u{color:var(--g3);background:var(--g3s)}
.cell.a-o{color:var(--g4);background:var(--g4s);font-size:11px}
.cell.g5{color:var(--g5)} .cell.g4{color:var(--g4)} .cell.g3{color:var(--g3)} .cell.g2{color:var(--g2);background:var(--g2s)} .cell.gn{color:var(--gn);background:var(--gns)}
.cell.miss{background:repeating-linear-gradient(-45deg,transparent 0 5px,color-mix(in srgb,var(--g2) 12%,transparent) 5px 6px)}
.c-sum{min-width:66px;text-align:center;font:600 13px var(--f-mono);padding:0 8px!important;white-space:nowrap}
.grid thead .c-sum{font:500 11.5px var(--f-body);color:var(--ink-2);padding:6px 8px!important;white-space:normal;line-height:1.2}
.c-sum.bad{color:var(--g2)} .c-sum.good{color:var(--g5)}
.fc{color:var(--ink-3);font-weight:400}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-3);align-items:center}
.legend .cell{width:24px;height:22px;border-radius:5px;display:inline-grid;vertical-align:middle;margin-right:4px;pointer-events:none}
.hint{font-size:12.5px;color:var(--ink-3)}
kbd{font:600 11px var(--f-mono);padding:1px 5px;border:1px solid var(--line-2);border-bottom-width:2px;border-radius:4px;background:var(--surface)}

/* summary table */
.stbl{width:100%;border-collapse:collapse;font-size:14px}
.stbl th{font-size:12px;font-weight:500;color:var(--ink-3);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;position:sticky;top:0;background:var(--surface)}
.stbl th button{color:inherit;font-weight:inherit}
.stbl th button[aria-pressed="true"]{color:var(--accent);font-weight:600}
.stbl td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
.stbl td.n{font:600 14px var(--f-mono);white-space:nowrap}
.stbl tr:last-child td{border-bottom:0}
.stbl tbody tr:hover td{background:var(--surface-2)}
.mini{display:flex;align-items:center;gap:8px;min-width:120px}
.mini .bar{flex:1;max-width:90px}
.badge{display:inline-grid;place-items:center;min-width:30px;height:26px;padding:0 6px;border-radius:6px;font:600 14px var(--f-mono)}
.badge.g5{color:var(--g5);background:var(--g5s)} .badge.g4{color:var(--g4);background:var(--g4s)} .badge.g3{color:var(--g3);background:var(--g3s)} .badge.g2{color:var(--g2);background:var(--g2s)} .badge.gx{color:var(--ink-3);background:var(--surface-2)}
.badge.fc{opacity:.75;border:1px dashed currentColor;background:transparent}

/* ---------- lesson mode ---------- */
.lm-head{display:grid;gap:14px;min-width:0}
.lm-head>*{min-width:0}
.lm-meta .seg{flex-wrap:wrap}
#lm-sel{width:100%;min-width:0;text-overflow:ellipsis}
.lm-pick{display:flex;gap:8px;align-items:center}
.lm-pick select{flex:1;min-width:0}
.lm-topic{font:500 26px/1.2 var(--f-display);margin:0;letter-spacing:-.01em;text-wrap:balance}
.lm-meta{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;font-size:14px;color:var(--ink-2)}
.lm-tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;position:sticky;top:calc(env(safe-area-inset-top,0px) + 61px);z-index:5;background:var(--bg);padding:10px 0}
.counter{font:600 15px var(--f-mono)}
.counter span{color:var(--ink-3);font-weight:400}
.lrows{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.lrow{display:flex;align-items:center;gap:12px;padding:9px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.lrow:last-child{border-bottom:0}
.lrow .lr-n{font:12px var(--f-mono);color:var(--ink-3);width:22px;text-align:right}
.lrow .lr-name{flex:1;min-width:170px;text-align:left;font-weight:500}
.lrow .lr-name:hover{color:var(--accent)}
.lrow.absent .lr-name{color:var(--ink-3)}
.opts{display:inline-flex;gap:4px}
.opt{min-width:40px;height:36px;padding:0 9px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font:600 14px var(--f-mono);color:var(--ink-2)}
.opt:hover{border-color:var(--line-2);background:var(--surface-2)}
.opt[aria-pressed="true"].v-p{background:var(--g5);border-color:var(--g5);color:#fff}
.opt[aria-pressed="true"].v-n{background:var(--g2);border-color:var(--g2);color:#fff}
.opt[aria-pressed="true"].v-u{background:var(--g3);border-color:var(--g3);color:#fff}
.opt[aria-pressed="true"].v-o{background:var(--g4);border-color:var(--g4);color:#fff}
.opt[aria-pressed="true"].v-g5{background:var(--g5s);border-color:var(--g5);color:var(--g5)}
.opt[aria-pressed="true"].v-g4{background:var(--g4s);border-color:var(--g4);color:var(--g4)}
.opt[aria-pressed="true"].v-g3{background:var(--g3s);border-color:var(--g3);color:var(--g3)}
.opt[aria-pressed="true"].v-g2{background:var(--g2s);border-color:var(--g2);color:var(--g2)}
.opt[aria-pressed="true"].v-gn{background:var(--gns);border-color:var(--gn);color:var(--gn)}
.opts .sep{width:1px;background:var(--line);margin:0 4px}
.lm-foot{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center}

/* ---------- plan ---------- */
.ptbl{width:100%;border-collapse:collapse;font-size:14px}
.ptbl th{text-align:left;font-size:12px;font-weight:500;color:var(--ink-3);padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}
.ptbl td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
.ptbl tr.sec td{background:var(--surface-2);font:600 13px var(--f-body);color:var(--ink-2);padding:9px 10px}
.ptbl .n{font:600 13px var(--f-mono);color:var(--ink-2);white-space:nowrap}
.ptbl .topic{min-width:220px}
.ptbl input[type=date]{padding:5px 6px;font-size:13px;border:1px solid var(--line);border-radius:6px;background:var(--surface);font-family:var(--f-mono);max-width:140px}
.ptbl select{padding:5px 6px;font-size:13px;border:1px solid var(--line);border-radius:6px;background:var(--surface)}
.ptbl tr.today td{background:var(--gold-soft)}
.ptbl tr.done .topic{color:var(--ink-2)}
.ptbl tr.cancel .topic{text-decoration:line-through;color:var(--ink-3)}
.kind{font-size:11px;font-weight:600;padding:2px 7px;border-radius:5px;background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.kind.pz{background:var(--accent-soft);color:var(--accent)}
.kind.exam{background:var(--gold-soft);color:var(--gold)}
.tbl-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.stats4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.stat b{display:block;font:600 24px var(--f-mono)}
.stat span{font-size:12.5px;color:var(--ink-3)}
details.tool{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
details.tool summary{cursor:pointer;padding:12px 16px;font-weight:600;list-style:none;display:flex;gap:8px;align-items:center}
details.tool summary::-webkit-details-marker{display:none}
details.tool summary::before{content:"▸";color:var(--ink-3);transition:transform .15s}
details.tool[open] summary::before{transform:rotate(90deg)}
details.tool .body{padding:0 16px 16px;display:flex;flex-direction:column;gap:12px}
.wd{display:flex;gap:4px;flex-wrap:wrap}
.wd label{display:inline-flex}
.wd input{position:absolute;opacity:0;pointer-events:none}
.wd span{padding:6px 10px;border:1px solid var(--line);border-radius:7px;font-weight:600;font-size:13px;cursor:pointer}
.wd input:checked+span{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.wd input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}

/* ---------- groups ---------- */
.gl{display:grid;grid-template-columns:260px minmax(0,1fr);gap:18px;align-items:start}
.glist{display:flex;flex-direction:column;gap:6px}
.gitem{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--surface);text-align:left;width:100%}
.gitem[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 3px 0 0 var(--accent)}
.gitem b{font:600 15px var(--f-display)}
.srow{display:flex;gap:8px;align-items:center;padding:5px 0;border-bottom:1px solid var(--line)}
.srow:last-child{border-bottom:0}
.srow .lr-n{font:12px var(--f-mono);color:var(--ink-3);width:24px;text-align:right;flex:none}
.srow .inp{flex:1;border-color:transparent;background:transparent}
.srow .inp:hover{border-color:var(--line)}
.srow .inp:focus{background:var(--surface)}
.srow .icon-btn{width:30px;height:30px}
.srow .icon-btn svg{width:16px;height:16px}

/* ---------- overlays ---------- */
.pop{position:fixed;z-index:80;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:10px;min-width:200px;max-width:min(320px,calc(100vw - 24px))}
.pop .ttl{font-size:12.5px;color:var(--ink-3);margin:0 2px 8px;line-height:1.35}
.pop .ttl b{color:var(--ink);font-weight:600}
.pop .opts{flex-wrap:wrap}
.pop .acts{display:flex;flex-direction:column;gap:4px;margin-top:8px;border-top:1px solid var(--line);padding-top:8px}
.pop .acts button{text-align:left;padding:7px 8px;border-radius:6px;font-size:13.5px}
.pop .acts button:hover{background:var(--surface-2)}
.scrim{position:fixed;inset:0;z-index:70;background:rgba(10,20,16,.35);display:flex;justify-content:flex-end}
.drawer{width:min(460px,100%);height:100%;background:var(--bg);overflow:auto;padding:22px 22px calc(30px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:16px;box-shadow:var(--shadow);animation:slide .2s ease-out}
@keyframes slide{from{transform:translateX(30px);opacity:.4}}
.drawer h2{font:500 26px/1.15 var(--f-display);margin:0;text-wrap:balance}
.kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.modal-c{position:fixed;inset:0;z-index:90;display:grid;place-items:center;background:rgba(10,20,16,.4);padding:16px}
.modal{background:var(--surface);border-radius:14px;padding:20px;max-width:420px;width:100%;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:14px}
.modal p{margin:0;color:var(--ink-2)}
.toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));z-index:95;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;box-shadow:var(--shadow);pointer-events:auto;display:flex;gap:12px;align-items:center;animation:up .2s ease-out}
.toast.err{background:var(--g2);color:#fff}
@keyframes up{from{transform:translateY(8px);opacity:0}}
.banner{padding:10px 14px;border-radius:var(--r-sm);background:var(--gold-soft);color:var(--ink);font-size:13.5px;border:1px solid color-mix(in srgb,var(--gold) 40%,transparent)}
.skel{height:120px;border-radius:var(--r);background:linear-gradient(90deg,var(--surface-2),var(--surface-3),var(--surface-2));background-size:200% 100%;animation:sk 1.2s infinite linear}
@keyframes sk{to{background-position:-200% 0}}

/* ---------- phone ---------- */
@media (max-width:860px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .side{display:none}
  .top{padding:10px 16px}
  .top h1{font-size:18px}
  .search{width:auto;flex:1}
  .search.collapsed{display:none}
  .only-m{display:grid}
  .content{padding:16px 16px calc(96px + env(safe-area-inset-bottom,0px));gap:18px}
  .tabbar{display:grid;grid-template-columns:repeat(4,1fr);position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--surface);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
  .tabbar button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;font-weight:500;color:var(--ink-3);padding:4px 0}
  .tabbar button svg{width:22px;height:22px}
  .tabbar button[aria-current="page"]{color:var(--accent)}
  .tabbar .mid span.ic{width:44px;height:30px;border-radius:10px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center}
  .two,.gl{grid-template-columns:minmax(0,1fr)}
  .hero .date{font-size:27px}
  .grid .c-name{min-width:150px;max-width:150px}
  .grid-wrap{max-height:calc(100dvh - 290px)}
  .stats4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .lrow{gap:8px 10px}
  .lrow .lr-name{min-width:0;flex-basis:calc(100% - 40px)}
  .lrow .opts{margin-left:32px}
  .opt{min-width:38px;height:38px}
  .lm-topic{font-size:21px}
  .lm-tools{top:calc(env(safe-area-inset-top,0px) + 57px)}
  .hide-m{display:none!important}
}

/* ---------- clarity layer ---------- */
.ctx{display:flex;flex-wrap:wrap;gap:12px 22px;align-items:flex-end}
.ctx-f{display:flex;flex-direction:column;gap:6px;min-width:0;max-width:100%}
.ctx-l{font-size:13px;color:var(--ink-3);font-weight:500}
.ctx-course{flex:0 1 400px}
.ctx-sel{font-weight:600;width:100%;padding:8px 10px}
.chip{display:inline-flex;align-items:center;gap:8px;padding:7px 14px}
.chip-n{font-size:12px;color:var(--ink-3);font-weight:500}

.tip{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:var(--r);background:var(--accent-soft);font-size:14px;line-height:1.5;color:var(--ink)}
.tip-i{flex:none;width:22px;height:22px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:700;font-size:13px;margin-top:1px}
.tip-b{flex:1;min-width:0}
.tip-x{width:30px;height:30px;margin:-4px -6px -4px 0}
.tip-x svg{width:16px;height:16px}
.steps{margin:6px 0 8px;padding-left:20px}
.steps li{margin:3px 0}
.linkbtn{color:var(--accent);font-weight:600;text-decoration:underline;text-underline-offset:3px;font-size:inherit;display:inline}
.lead{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center}
.lead p,.lead-p{margin:0;color:var(--ink-2);max-width:70ch}
.hero-d{margin:0;color:var(--ink-3);font-size:14.5px}
.hero-d::first-letter{text-transform:uppercase}
.hero-h{font:500 34px/1.1 var(--f-display);margin:4px 0 6px;letter-spacing:-.02em;text-wrap:balance}
.hero-s{margin:0;color:var(--ink-2);font-size:16px}
.btn.lg{padding:12px 20px;font-size:15px}
.btn:disabled{opacity:.45;cursor:default}
.icon-btn:disabled{opacity:.35;cursor:default}
.stack{display:flex;flex-direction:column;gap:18px;min-width:0}
.sec-h{display:flex;align-items:center;gap:10px;justify-content:space-between}
.sec-p{margin:6px 0 4px}
.count{font-size:13px;font-weight:600;padding:2px 10px;border-radius:99px;background:var(--surface-2);color:var(--ink-2)}
.count.red{background:var(--g2s);color:var(--g2)}
.card.warn{border-color:color-mix(in srgb,var(--gold) 45%,var(--line));background:color-mix(in srgb,var(--gold-soft) 50%,var(--surface))}
.lrow2{display:flex;align-items:center;gap:14px;padding:11px 0;border-bottom:1px solid var(--line)}
.lrow2:last-child{border-bottom:0}
.lr-when{width:54px;flex:none;display:flex;flex-direction:column;font-size:12.5px;color:var(--ink-3);line-height:1.25}
.lr-when b{font-size:15px;color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.lrow2 .grow{flex:1;min-width:0}
.lrow2 .t{font-weight:500;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.lrow2 .s{font-size:12.5px;color:var(--ink-3);margin-top:2px}
.nowrap{flex-wrap:nowrap}
.srisk{display:flex;align-items:center;gap:10px;width:calc(100% + 16px);text-align:left;padding:10px 8px;margin:0 -8px;border-radius:8px;border-bottom:1px solid var(--line)}
.srisk:last-child{border-bottom:0}
.srisk:hover{background:var(--surface-2)}
.srisk .grow{flex:1;min-width:0}
.srisk .t{display:block;font-weight:500}
.srisk .s{display:block;font-size:12.5px;color:var(--ink-3)}
.tags{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.tag{font-size:12px;font-weight:600;padding:3px 8px;border-radius:6px;white-space:nowrap}
.tag.red{background:var(--g2s);color:var(--g2)}
.tag.amber{background:var(--g3s);color:var(--g3)}
.gcard{padding:0;gap:0;overflow:hidden}
.gcard:hover{transform:none}
.gc-main{display:flex;flex-direction:column;gap:12px;padding:16px 16px 12px;text-align:left;width:100%}
.gc-main:hover .gc-name{color:var(--accent)}
.gc-course{margin-top:-8px}
.gc-prog{display:flex;flex-direction:column;gap:6px}
.gc-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.gc-stats span{display:flex;flex-direction:column}
.gc-stats b{font-size:19px;font-weight:600;font-variant-numeric:tabular-nums}
.gc-stats b.red{color:var(--g2)}
.gc-stats small{font-size:12px;color:var(--ink-3)}
.gc-foot{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:0 16px 14px}
.gc-next{margin:0;padding:10px 16px 14px;border-top:1px solid var(--line);font-size:13px;color:var(--ink-2)}
.gc-next span{-webkit-line-clamp:2;display:-webkit-box;-webkit-box-orient:vertical;overflow:hidden}
.jbar{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center}
.seg.big button{padding:8px 16px;font-size:15px}
.cell.e:hover::before{content:"+";color:var(--ink-3);font-weight:400;font-size:16px}
.lh:hover .n{color:var(--accent);text-decoration:underline;text-underline-offset:2px}
.plist{display:flex;flex-direction:column;gap:2px;min-width:230px}

.popt.v-u .pk{background:var(--g3s);color:var(--g3)}

.pclear{display:flex;gap:8px;align-items:center;margin-top:8px;padding:8px 6px 2px;border-top:1px solid var(--line);width:100%;font-size:13.5px;color:var(--ink-2)}

/* ---------- calm layer ---------- */
.shell{transition:grid-template-columns .18s ease}

.glist2{display:flex;flex-direction:column}

.grid .c-first{border-left:2px solid var(--line-2)}

.next-t{font:500 22px/1.25 var(--f-display);margin:0;text-wrap:balance}
.tool-card{display:flex;flex-direction:column;gap:12px}

  .ptbl.ls tr:not(.sec){display:grid;grid-template-columns:26px auto 1fr auto;column-gap:8px;row-gap:8px;align-items:center;padding:12px 10px;border-bottom:1px solid var(--line)}
  .ptbl.ls tr:not(.sec) td{border:0;padding:0;background:transparent}

/* ================= state ================= */
const S = {
  mode: "connecting", courses: {}, groups: {}, settings: {}, loaded: { courses: false, groups: false },

/* ================= store ================= */
const Store = {
  db: null, pending: {}, inflight: {}, timers: {}, busy: {}, deleted: new Set(),
  async init() {

    if (!db) { S.mode = "local"; const d = LS.get("zh-local", null); if (d) { S.courses = d.courses || {}; S.groups = d.groups || {}; S.settings = d.settings || {}; } S.loaded = { courses: true, groups: true }; render(); return; }

      }

  },
  overlay(path, base) {

    return base;
  },
  local(path) { const [c, id] = path.split("/"); if (c === "groups") return S.groups[id]; if (c === "courses") return S.courses[id]; if (path === "meta/settings") return S.settings; },
  apply(path, data, set) {

    const m = S[c]; if (set || !m[id]) m[id] = Object.assign(clone(data), { id }); else merge(m[id], data);
  },
  patch(path, data) { this.apply(path, data, false); const q = this.pending[path]; if (q) merge(q.data, data); else this.pending[path] = { set: false, data: clone(data) }; this.later(path); render(); },
  set(path, data) { this.deleted.delete(path); this.apply(path, data, true); this.pending[path] = { set: true, data: clone(data) }; this.later(path, 50); render(); },
  async remove(path) {

  async flush(path) {

  fail(e) {

let syncing = false;
function setSync(v) { syncing = v; const el = $("#syncdot"); if (el) { el.className = "dot " + (v ? "warn" : S.mode === "cloud" ? "ok" : "warn"); } const t = $("#synctxt"); if (t) t.textContent = syncText(); }
const syncText = () => S.mode === "cloud" ? (syncing ? "Сохраняю…" : "Сохранено в облаке") : S.mode === "local" ? (STANDALONE ? "Данные хранятся на этом устройстве" : "Данные только в этом браузере") : "Подключаюсь…";

/* ================= domain ================= */
const groupsSorted = () => Object.values(S.groups).sort((a, b) => (a.order || 0) - (b.order || 0) || String(a.name).localeCompare(b.name, "ru"));
const coursesSorted = () => Object.values(S.courses).sort((a, b) => String(a.title).localeCompare(b.title, "ru"));
const cshort = c => c ? (c.short || String(c.title || "").split(" ")[0] || "Дисциплина") : "";
const activeCourses = () => coursesSorted().filter(c => Object.values(S.groups).some(g => g.courseId === c.id));
const multiCourse = () => activeCourses().length > 1;
const curCourseId = () => {
  const ac = activeCourses(); if (!ac.length) return null;
  if (!ac.some(c => c.id === S.ui.cid)) { const g0 = S.groups[S.ui.gid]; S.ui.cid = g0 && ac.some(c => c.id === g0.courseId) ? g0.courseId : ac[0].id; }
  return S.ui.cid;
};
const groupsOfCourse = () => multiCourse() ? groupsSorted().filter(g => g.courseId === curCourseId()) : groupsSorted();
const curGroup = () => { let g = S.groups[S.ui.gid]; const list = groupsOfCourse(); if (!g || (list.length && !list.includes(g))) { g = list[0] || groupsSorted()[0]; if (g) S.ui.gid = g.id; } return g; };
const gname = g => multiCourse() ? `${g.name} (${cshort(S.courses[g.courseId])})` : g.name;
const examName = g => { const e = lessonsOf(g).find(l => l.kind === "exam"); return e && /зач/i.test(e.topic) ? "Зачёт" : "Экзамен"; };
const kindLabel = (g, l) => l.kind === "exam" ? examName(g) : KINDS[l.kind].label;
const courseOf = g => (g && S.courses[g.courseId]) || { lessons: [], title: "—" };
const lessonsOf = g => courseOf(g).lessons || [];
const attLessons = g => lessonsOf(g).filter(l => l.kind !== "sr" && l.kind !== "exam");
const gradeLessons = g => lessonsOf(g).filter(l => l.graded);
const sch = (g, lid) => ((g.sched || {})[lid]) || {};
const stOf = (g, lid) => sch(g, lid).status || "plan";
const dOf = (g, lid) => sch(g, lid).fact || sch(g, lid).plan || "";
const mk = (g, sid, lid) => (((g.marks || {})[sid] || {})[lid]) || {};
const students = g => (g.students || []);
function numbering(g) {
  const map = {}; let n = 0, k = 0;
  for (const l of lessonsOf(g)) {
    if (l.kind === "lec" || l.kind === "pz") map[l.id] = String(++n);
    else if (l.kind === "cons") map[l.id] = "К" + (++k);
    else if (l.kind === "sr") map[l.id] = "СР";
    else map[l.id] = "Экз";
  }
  return map;
}
const gradeLabel = (l, no) => l.kind === "pz" && l.pz ? "ПЗ" + l.pz : (KINDS[l.kind]?.short || "") + no[l.id];
function stuStats(g, s) {
  let pres = 0, abs = 0, exc = 0, late = 0;
  for (const l of attLessons(g)) { const a = mk(g, s.id, l.id).a; if (a === "Б") pres++; else if (a === "Н") abs++; else if (a === "У") exc++; else if (a === "О") late++; }
  const tot = pres + abs + exc + late, pct = tot ? Math.round((pres + late) / tot * 100) : null;
  const nums = []; let twos = 0, nn = 0, miss = 0; const debtList = [];
  for (const l of gradeLessons(g)) {
    const v = mk(g, s.id, l.id).g;
    if (v && /^[2-5]$/.test(v)) nums.push(+v);
    if (v === "2") { twos++; debtList.push([l, "2"]); }
    else if (v === "н") { nn++; debtList.push([l, "н"]); }
    else if (!v && stOf(g, l.id) === "done") { miss++; debtList.push([l, ""]); }
  }
  const avg = nums.length ? nums.reduce((a, b) => a + b, 0) / nums.length : null;
  const ex = (g.exam || {})[s.id] || "";
  const exN = /^[2-5]$/.test(ex) ? +ex : null;
  let fin = null, fc = false;
  if (exN != null && avg != null) fin = Math.round((avg + exN) / 2); else if (exN != null) fin = exN; else if (avg != null) { fin = Math.round(avg); fc = true; }
  const debts = twos + nn + miss, st = settings();
  const risk = (pct != null && pct < st.attLow) || debts >= st.debtHigh;

}
function grpStats(g) {
  const main = lessonsOf(g).filter(l => l.kind === "lec" || l.kind === "pz");
  const done = main.filter(l => stOf(g, l.id) === "done").length;
  let p = 0, t = 0, sum = 0, cnt = 0, risk = 0;
  for (const s of students(g)) { const st = stuStats(g, s); p += st.pres + st.late; t += st.tot; if (st.avg != null) { sum += st.avg; cnt++; } if (st.risk) risk++; }
  const next = lessonsOf(g).find(l => l.kind !== "sr" && ["plan", "moved"].includes(stOf(g, l.id)));
  return { total: main.length, done, pct: t ? Math.round(p / t * 100) : null, avg: cnt ? sum / cnt : null, risk, next };
}
function renumberPZ(ls) { let mx = Math.max(0, ...ls.filter(l => l.kind === "pz" && l.pz).map(l => l.pz)); for (const l of ls) { if (l.kind === "pz") { if (!l.pz) l.pz = ++mx; } else l.pz = null; } return ls; }

/* ================= actions ================= */
const gpath = g => "groups/" + g.id;
function markAtt(g, sid, lid, v) {
  const p = { marks: { [sid]: { [lid]: { a: v || null } } } };
  if (v && stOf(g, lid) === "plan") { p.sched = { [lid]: { status: "done", ...(dOf(g, lid) ? {} : { plan: todayISO() }) } }; toast("Занятие отмечено как проведённое"); }
  Store.patch(gpath(g), p);
}
function markGrade(g, sid, lid, v) {
  const m = { g: v || null };
  const p = { marks: { [sid]: { [lid]: m } } };
  if (v && stOf(g, lid) === "plan") p.sched = { [lid]: { status: "done", ...(dOf(g, lid) ? {} : { plan: todayISO() }) } };
  Store.patch(gpath(g), p);
}
function markExam(g, sid, v) { Store.patch(gpath(g), { exam: { [sid]: v || null } }); }
function allPresent(g, lid) {
  const m = {}; let n = 0;
  for (const s of students(g)) if (!mk(g, s.id, lid).a) { m[s.id] = { [lid]: { a: "Б" } }; n++; }
  const p = { marks: m }; if (stOf(g, lid) === "plan") p.sched = { [lid]: { status: "done", ...(dOf(g, lid) ? {} : { plan: todayISO() }) } };
  if (n || p.sched) Store.patch(gpath(g), p);

}

/* ================= overlays ================= */
const layer = $("#layer");
let popState = null;
function openPop(anchor, html, state) {

  layer.appendChild(el); popState = Object.assign({ el, anchor }, state || {});
  const r = anchor.getBoundingClientRect(), w = el.offsetWidth, h = el.offsetHeight;
  let x = Math.min(Math.max(8, r.left + r.width / 2 - w / 2), innerWidth - w - 8);

  anchor.classList && anchor.classList.add("sel");
}
function closePop() { if (popState) { popState.el.remove(); popState.anchor?.classList?.remove("sel"); popState = null; } }
function modal({ title, text, ok = "Подтвердить", danger = false, onOk, alt, onAlt }) {

}

}

    <td class="c-sum c-first ${x.pct != null && x.pct < st.attLow ? "bad" : ""}">${x.pct ?? "—"}${x.pct != null ? "%" : ""}</td>

  const g = curGroup();

  if (!students(g).length) return head + `<div class="card empty"><b>В группе ${esc(g.name)} пока нет студентов</b><span>Вставьте список ФИО — по одному в строке, можно прямо из Excel.</span><button class="btn pri" data-act="manage-group" data-gid="${g.id}">Добавить студентов</button></div>`;
  return head + tip("journal", `Вся группа в одной таблице: «н» — пропуск, цифра — оценка, итоги справа. Переключатель сверху показывает только посещаемость или только оценки. Нажмите на клетку, чтобы отметить пропуск или поставить оценку. Нажмите на номер занятия в шапке — отметить всех сразу или открыть занятие.<span class="hide-m"> С клавиатуры: <kbd>Н</kbd> пропуск, <kbd>Б</kbd> был, <kbd>2</kbd>–<kbd>5</kbd> оценка, стрелки — переход.</span>`) + gridAll(g);

/* ---------- Провести занятие ---------- */
function defaultLesson(g) {
  const ls = lessonsOf(g).filter(l => l.kind !== "sr"), t = todayISO();
  const tod = ls.filter(l => dOf(g, l.id) === t && stOf(g, l.id) !== "cancel");
  const tu = tod.find(l => stOf(g, l.id) !== "done"); if (tu) return tu.id;
  if (tod.length) return tod[tod.length - 1].id;
  const nx = ls.find(l => ["plan", "moved"].includes(stOf(g, l.id))); return (nx || ls[ls.length - 1] || {}).id;
}
const ATT_WORD = { "Б": "Был", "Н": "Нет", "У": "Уваж.", "О": "Опозд." };
function vLesson() {

  const l = ls.find(x => x.id === S.ui.lessonId), idx = ls.indexOf(l), st = stOf(g, l.id), s0 = sch(g, l.id);
  const ss = students(g); const isExam = l.kind === "exam"; const graded = l.graded || isExam;
  const secs = {}; ls.forEach(x => (secs[x.section || "Без раздела"] ||= []).push(x));
  const opts = Object.entries(secs).map(([sec, arr]) => `<optgroup label="${esc(sec)}">${arr.map(x => { const s = stOf(g, x.id); return `<option value="${x.id}" ${x.id === l.id ? "selected" : ""}>${s === "done" ? "✓ " : s === "cancel" ? "✕ " : ""}${esc(no[x.id])}. ${x.kind === "pz" ? "ПЗ " + x.pz + ": " : ""}${esc(x.topic.slice(0, 70))}${dOf(g, x.id) ? ` (${fmtD(dOf(g, x.id))})` : ""}</option>`; }).join("")}</optgroup>`).join("");
  let pres = 0, marked = 0; ss.forEach(s => { const a = mk(g, s.id, l.id).a; if (a) { marked++; if (a === "Б" || a === "О") pres++; } });
  const attOpts = s => { const a = mk(g, s.id, l.id).a; return Object.entries(ATT).map(([k, o]) => `<button class="opt w v-${o.cls}" data-act="lm-set" data-k="a:${s.id}:${l.id}" data-v="${k}" aria-pressed="${a === k}" title="${o.label}">${ATT_WORD[k]}</button>`).join(""); };
  const grOpts = s => { const v = isExam ? ((g.exam || {})[s.id] || "") : mk(g, s.id, l.id).g; const key = isExam ? `x:${s.id}` : `g:${s.id}:${l.id}`; return GR.map(k => `<button class="opt v-${gcls(k)}" data-act="lm-set" data-k="${key}" data-v="${k}" aria-pressed="${v === k}" title="${k === "н" ? "не аттестован" : "оценка " + k}">${k}</button>`).join(""); };
  const kindTxt = l.kind === "pz" ? `Практическая работа ${l.pz}` : kindLabel(g, l);
  const stPill = `<span class="pill st-${st}">${STATUS[st]}</span>`;
  const next = ls[idx + 1];
  return `<button class="back" data-act="lessons-list">${ic("left")}Все занятия группы ${esc(g.name)}</button>

    ${ss.map((s, i) => { const a = mk(g, s.id, l.id).a; return `<li class="lrow ${a === "Н" || a === "У" ? "absent" : ""} ${!a && !isExam ? "unmarked" : ""}"><span class="lr-n">${i + 1}</span><button class="lr-name" data-act="student" data-sid="${s.id}" title="Открыть карточку студента">${esc(s.name)}</button>
      ${!isExam ? `<div class="opts" role="group" aria-label="Посещение: ${esc(s.name)}">${attOpts(s)}</div>` : ""}${graded ? `<div class="opts gr" role="group" aria-label="Оценка: ${esc(s.name)}">${grOpts(s)}</div>` : ""}</li>`; }).join("")}</ul>

    ${next ? `<button class="btn pri lg" data-act="lm-finish" data-lid="${l.id}">${st === "done" ? "К следующему занятию" : "Завершить занятие"}${ic("right")}</button>` : st !== "done" ? `<button class="btn pri lg" data-act="set-status" data-lid="${l.id}" data-v="done">${ic("check")}Завершить занятие</button>` : ""}</div>`;
}

/* ---------- Занятия ---------- */

        <td class="n muted">${m ? `${pres}/${ss.length}` : ""}</td>

/* ================= cell editing ================= */
function cellPop(btn) {
  const k = btn.dataset.k, [t, sid, lid] = k.split(":"); const g = curGroup(); const s = students(g).find(x => x.id === sid);
  const no = numbering(g);
  const grades = (key, cur) => `<div class="opts">${GR.map(v => `<button class="opt v-${gcls(v)}" data-act="pop-set" data-k="${key}" data-v="${v}" aria-pressed="${cur === v}" title="${v === "н" ? "не аттестован" : "оценка " + v}">${v}</button>`).join("")}</div><p class="small muted" style="margin:2px 2px 0">«н» — не аттестован</p>`;
  let body, what, has;
  if (t === "x") {
    const cur = (g.exam || {})[sid]; has = !!cur; what = examName(g);
    body = `<div class="psec">${grades(k, cur)}</div>`;
  } else {
    const l = lessonsOf(g).find(x => x.id === lid), m = mk(g, sid, lid);
    what = `Занятие ${no[lid]}${dOf(g, lid) ? ", " + fmtD(dOf(g, lid)) : ""}: ${esc(l.topic.slice(0, 50))}`;
    const att = `<div class="psec"><span class="ctx-l">Посещение</span><div class="opts">${Object.entries(ATT).map(([kk, o]) => `<button class="opt w v-${o.cls}" data-act="pop-set" data-k="a:${sid}:${lid}" data-v="${kk}" aria-pressed="${m.a === kk}">${ATT_WORD[kk]}</button>`).join("")}</div></div>`;
    const gr = `<div class="psec"><span class="ctx-l">Оценка</span>${grades(`g:${sid}:${lid}`, m.g)}</div>`;
    if (t === "a") { body = att; has = !!m.a; }
    else if (t === "g") { body = gr; has = !!m.g; }
    else { body = att + (l.graded || m.g ? gr : ""); has = !!(m.a || m.g); }
  }
  openPop(btn, `<div class="ttl"><b>${esc(s.name)}</b><br>${what}</div>${body}${has ? `<button class="pclear" data-act="pop-clear" data-k="${k}">${ic("x")}Очистить</button>` : ""}`, { k });
}
function applyCell(k, v) {
  const [t, sid, lid] = k.split(":"); const g = curGroup();
  if (t === "a") markAtt(g, sid, lid, v); else if (t === "g") markGrade(g, sid, lid, v); else markExam(g, sid, v);
}
function moveFocus(from, dr, dc) {
  const r = +from.dataset.r + dr, c = +from.dataset.c + dc;
  const t = $("#main").querySelector(`.cell[data-r="${r}"][data-c="${c}"]`);
  if (t) { t.focus(); t.scrollIntoView({ block: "nearest", inline: "nearest" }); return t; }
}
const KEYMAP_A = { "б": "Б", ",": "Б", "+": "Б", "=": "Б", "1": "Б", "н": "Н", "y": "Н", "-": "Н", "0": "Н", "у": "У", "e": "У", "о": "О", "j": "О" };
const KEYMAP_G = { "2": "2", "3": "3", "4": "4", "5": "5" };
const KEYMAP_GN = { ...KEYMAP_G, "н": "н", "y": "н" };

  if (popState && !popState.el.contains(e.target) && e.target !== popState.anchor) closePop();
  const b = e.target.closest("[data-act]"); if (!b) return;

document.addEventListener("change", e => {

/* ================= group & plan helpers ================= */
const parseNames = txt => String(txt || "").split(/\r?\n/).map(s => s.replace(/^\s*\d+[.)]?\s*/, "").replace(/\t.*$/, "").trim().replace(/\s+/g, " ")).filter(Boolean);
function createGroup() {
  const name = $("#ng-name").value.trim(); if (!name) { toast("Введите название группы"); $("#ng-name").focus(); return; }
  let cid = $("#ng-course").value;
  if (cid === "__new" || !cid) { cid = uid("c"); Store.set("courses/" + cid, { title: "Дисциплина для " + name, semester: "", lessons: [] }); }
  const id = uid("g"); const names = parseNames($("#ng-list").value);
  const order = Math.max(0, ...groupsSorted().map(g => g.order || 0)) + 1;
  Store.set("groups/" + id, { name, courseId: cid, order, students: names.map(n => ({ id: uid("s"), name: n })), sched: {}, marks: {}, exam: {} });
  S.ui.newGroup = false; S.ui.mgid = id; S.ui.gid = id; render(); toast(`Группа ${name} создана${names.length ? ", студентов: " + names.length : ""}`);
}
function autoDates(g) {
  const start = $("#ad-start").value, per = +$("#ad-per").value || 1;
  const days = new Set([...document.querySelectorAll("#ad-wd input:checked")].map(i => +i.value));
  if (!start || !days.size) { toast("Выберите дату начала и хотя бы один день недели"); return; }
  const ls = lessonsOf(g).filter(l => l.kind !== "sr" && !["done", "cancel"].includes(stOf(g, l.id)));
  if (!ls.length) { toast("Все занятия уже проведены"); return; }
  const d = new Date(start + "T12:00"); let slot = 0; const p = {};
  for (const l of ls) { let guard = 0; while (!days.has(d.getDay()) && guard++ < 8) d.setDate(d.getDate() + 1); p[l.id] = { plan: isoOf(d), fact: null }; if (++slot >= per) { slot = 0; d.setDate(d.getDate() + 1); } }
  const last = p[ls[ls.length - 1].id].plan;
  modal({ title: "Расставить даты?", text: `${ls.length} ${plural(ls.length, "занятие получит", "занятия получат", "занятий получат")} даты с ${fmtLong(start)} по ${fmtLong(last)}. Прежние плановые даты этих занятий заменятся.`, ok: "Расставить", onOk: () => { Store.patch(gpath(g), { sched: p }); toast("Даты расставлены"); } });
}

/* ================= export / import ================= */
async function saveFile(filename, data) {
  let dl = null; try { dl = await window.claude?.use?.("downloads"); } catch (e) {}
  if (!dl) {
    if (!STANDALONE) { toast("Скачивание недоступно в этом окне. Откройте журнал в Claude.", "err"); return false; }
    const blob = data instanceof Blob ? data : new Blob([data], { type: filename.endsWith(".json") ? "application/json" : "application/octet-stream" });
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = filename; document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 4000); return true;
  }
  try { await dl.save({ filename, data }); return true; } catch (e) { if (e && e.code !== "declined") toast("Не удалось сохранить файл: " + (e.message || e.code), "err"); return false; }
}
function loadXLSX() {
  if (window.XLSX) return Promise.resolve(window.XLSX);
  return new Promise((res, rej) => { const s = document.createElement("script"); s.src = "https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"; s.crossOrigin = "anonymous"; s.onload = () => res(window.XLSX); s.onerror = () => rej(new Error("load")); document.head.appendChild(s); });
}
async function exportXlsx() {
  const ids = [...document.querySelectorAll(".xg:checked")].map(i => i.value); if (!ids.length) { toast("Выберите хотя бы одну группу"); return; }
  let X; try { X = await loadXLSX(); } catch (e) { toast("Не удалось загрузить модуль Excel. Проверьте интернет.", "err"); return; }
  const wb = X.utils.book_new(); const usedCourses = new Set();
  const nm = s => { let b = s.replace(/[\\/?*\[\]:]/g, "").slice(0, 31), n = b, k = 2; while (wb.SheetNames.includes(n)) n = b.slice(0, 28) + " " + (k++); return n; };
  for (const id of ids) {
    const g = S.groups[id]; const no = numbering(g); usedCourses.add(g.courseId);
    const gl = gradeLessons(g), al = attLessons(g);
    const A = [[`Группа ${g.name} — журнал успеваемости (${courseOf(g).title})`], [], ["№", "ФИО студента", ...gl.map(l => gradeLabel(l, no)), "Средний балл", "Долги", examName(g), "Итог"], ["", "дата", ...gl.map(l => fmtD(dOf(g, l.id))), "", "", "", ""]];
    students(g).forEach((s, i) => { const x = stuStats(g, s); A.push([i + 1, s.name, ...gl.map(l => { const v = mk(g, s.id, l.id).g; return /^[2-5]$/.test(v || "") ? +v : (v || ""); }), x.avg != null ? Math.round(x.avg * 100) / 100 : "", x.debts || "", x.ex ? (/^[2-5]$/.test(x.ex) ? +x.ex : x.ex) : "", x.fin ?? ""]); });
    const w1 = X.utils.aoa_to_sheet(A); w1["!cols"] = [{ wch: 4 }, { wch: 34 }, ...gl.map(() => ({ wch: 6 })), { wch: 12 }, { wch: 8 }, { wch: 9 }, { wch: 7 }];
    const sfx = multiCourse() ? " " + cshort(courseOf(g)) : "";
    X.utils.book_append_sheet(wb, w1, nm("Оценки " + g.name + sfx));
    const B = [[`Группа ${g.name} — посещаемость`], [], ["№", "ФИО студента", ...al.map(l => no[l.id]), "Пропущено", "Посещаемость, %"], ["", "дата", ...al.map(l => fmtD(dOf(g, l.id))), "", ""]];
    students(g).forEach((s, i) => { const x = stuStats(g, s); B.push([i + 1, s.name, ...al.map(l => mk(g, s.id, l.id).a || ""), x.abs + x.exc, x.pct ?? ""]); });
    const w2 = X.utils.aoa_to_sheet(B); w2["!cols"] = [{ wch: 4 }, { wch: 34 }, ...al.map(() => ({ wch: 5 })), { wch: 10 }, { wch: 14 }];
    X.utils.book_append_sheet(wb, w2, nm("Посещ. " + g.name + sfx));
  }
  const gsel = ids.map(i => S.groups[i]);
  for (const cid of usedCourses) {
    const c = S.courses[cid]; if (!c) continue; const gg = gsel.filter(g => g.courseId === cid); const no = numbering(gg[0]);
    const K = [[c.title + (c.semester ? " — " + c.semester : "")], [], ["№", "Вид", "Тема", "Часы", ...gg.flatMap(g => [g.name + ": дата", "статус"])]];
    let sec = null;
    for (const l of c.lessons || []) { if (l.section !== sec) { sec = l.section; K.push([sec || ""]); } K.push([no[l.id], l.kind === "pz" ? "ПЗ " + l.pz : KINDS[l.kind].label, l.topic, l.hours || "", ...gg.flatMap(g => { const s = sch(g, l.id); return [fmtD(dOf(g, l.id)), l.kind === "sr" ? "" : STATUS[s.status || "plan"]]; })]); }
    const w = X.utils.aoa_to_sheet(K); w["!cols"] = [{ wch: 5 }, { wch: 12 }, { wch: 60 }, { wch: 6 }, ...gg.flatMap(() => [{ wch: 9 }, { wch: 13 }])];
    X.utils.book_append_sheet(wb, w, nm("КТП " + cshort(c)));
  }
  const buf = X.write(wb, { type: "array", bookType: "xlsx" });

}
function exportJson() {
  const data = { app: "zhurnal", version: 1, exportedAt: new Date().toISOString(), settings: S.settings, courses: S.courses, groups: S.groups };
  saveFile(`zhurnal-kopiya-${todayISO()}.json`, JSON.stringify(data, null, 1)).then(ok => { if (ok) { LS.set("zh-lastbackup", todayISO()); render(); } });
}
function importJson(file) {
  if (!file) return; const r = new FileReader();
  r.onload = () => {
    let d; try { d = JSON.parse(r.result); } catch (e) { toast("Файл не похож на копию журнала", "err"); return; }
    if (!d || d.app !== "zhurnal" || !d.groups || !d.courses) { toast("Это не резервная копия журнала", "err"); return; }
    const ng = Object.keys(d.groups).length, ns = Object.values(d.groups).reduce((a, g) => a + (g.students || []).length, 0);
    const titles = Object.values(d.courses).map(c => c.title).join(", ");
    const add = () => {
      for (const [id, c] of Object.entries(d.courses)) Store.set("courses/" + id, c);
      for (const [id, g] of Object.entries(d.groups)) Store.set("groups/" + id, g);
      const first = Object.values(d.groups)[0]; if (first) { S.ui.cid = first.courseId; S.ui.gid = first.id; }
      toast("Данные добавлены в журнал");
    };
    if (!Object.keys(S.groups).length) { add(); return; }
    modal({ title: "Загрузить копию", text: `В файле: ${esc(titles)} — ${ng} ${plural(ng, "группа", "группы", "групп")}, ${ns} ${plural(ns, "студент", "студента", "студентов")}. <br><br><b>Добавить</b> — данные из файла появятся рядом с текущими (совпадающие группы этой же дисциплины обновятся). <b>Заменить всё</b> — журнал станет точной копией файла.`, ok: "Добавить", onOk: add, alt: "Заменить всё", onAlt: () => {
      for (const id of Object.keys(S.groups)) if (!d.groups[id]) Store.remove("groups/" + id);
      for (const id of Object.keys(S.courses)) if (!d.courses[id]) Store.remove("courses/" + id);
      for (const [id, c] of Object.entries(d.courses)) Store.set("courses/" + id, c);
      for (const [id, g] of Object.entries(d.groups)) Store.set("groups/" + id, g);
      if (d.settings) Store.set("meta/settings", d.settings);
      toast("Данные восстановлены");
    } });
  };
  r.readAsText(file);
}

function lastBackupText() { if (!STANDALONE) return ""; const d = LS.get("zh-lastbackup", null); return d ? ` Последняя копия: ${fmtLong(d)}.` : " Копий ещё не было."; }

}
